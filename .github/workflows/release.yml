name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload binaries for"
        required: true

permissions:
  contents: write

env:
  BIN: fromsoft-trophy-helper

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ASSET="$BIN-$TAG-${{ matrix.name }}.zip"
          cd "target/${{ matrix.target }}/release"
          7z a "$ASSET" "$BIN.exe"
          echo "ASSET=target/${{ matrix.target }}/release/$ASSET" >> "$GITHUB_ENV"

      - name: Package (macOS .app bundle)
        if: runner.os == 'macOS'
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ASSET="$BIN-$TAG-${{ matrix.name }}.zip"
          APP="FromSoft Trophy Helper.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/$BIN" "$APP/Contents/MacOS/"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>FromSoft Trophy Helper</string>
            <key>CFBundleDisplayName</key><string>FromSoft Trophy Helper</string>
            <key>CFBundleIdentifier</key><string>com.nickpisano.fromsoft-trophy-helper</string>
            <key>CFBundleExecutable</key><string>$BIN</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${TAG#v}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          zip -r "$ASSET" "$APP"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Package (Linux tar.gz)
        if: runner.os == 'Linux'
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ASSET="$BIN-$TAG-${{ matrix.name }}.tar.gz"
          tar czf "$ASSET" -C "target/${{ matrix.target }}/release" "$BIN"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Tag pushes may land before a release exists; create it if needed.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes || true
          gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
